plugin:
  name: kulturgis
  version: 1.1
  url: https://github.com/gbv/fylr-plugin-kulturgis
  displayname:
    de-DE: KulturGIS
    en-US: KulturGIS
  server:
    api-version:
      require: 1
  webfrontend:
    url: kulturgis.js
    css: kulturgis.css
    dependencies:
      custom-data-type-nfis-geometry
  l10n: l10n/kulturgis.csv

base_url_prefix: webfrontend

base_config:
  - name: kulturgis_tags
    parameters:
      hamburg_tag_id:
        type: int
        position: 0
      niedersachsen_tag_id:
        type: int
        position: 1
  - name: kulturgis_archaeodox
    parameters:
      url:
        type: text
        position: 0
      client_id:
        type: text
        position: 1
      client_secret:
        type: secret
        position: 2
      username:
        type: text
        position: 3
      password:
        type: secret
        position: 4
      tag_pool_mapping:
        type: table
        fields:
          - name: kulturgis_tag_id
            type: int
            position: 0
          - name: archaeodox_pool_id
            type: int
            position: 1
        position: 5

extensions:
  linkEnsembleWithPlaces:
    exec:
      service: "node"
      commands:
        - prog: "node"
          stdin:
            type: "body"
          stdout:
            type: "body"
          args:
            - type: "value"
              value: "%_exec.pluginDir%/server/extension/linkEnsembleWithPlaces.js"
            - type: "value"
              value: "%info.json%"
  getAlkisData:
    exec:
      service: "node"
      commands:
        - prog: "node"
          stdin:
            type: "body"
          stdout:
            type: "body"
          args:
            - type: "value"
              value: "%_exec.pluginDir%/server/extension/getAlkisData.js"
            - type: "value"
              value: "%info.json%"
  createArchaeodoxFindplaces:
    exec:
      service: "node"
      commands:
        - prog: "node"
          stdin:
            type: "body"
          stdout:
            type: "body"
          args:
            - type: "value"
              value: "%_exec.pluginDir%/server/extension/createArchaeodoxFindplaces.js"
            - type: "value"
              value: "%info.json%"
  createArchaeodoxEnsembles:
    exec:
      service: "node"
      commands:
        - prog: "node"
          stdin:
            type: "body"
          stdout:
            type: "body"
          args:
            - type: "value"
              value: "%_exec.pluginDir%/server/extension/createArchaeodoxEnsembles.js"
            - type: "value"
              value: "%info.json%"
